# Backend API Service -- build, push, and deploy to GCP (Cloud Run).
# Replaces the AWS backend-deploy.yml workflow now that production has
# migrated off AWS. Uses Workload Identity Federation (no long-lived keys):
# GitHub Actions exchanges its OIDC token for the de-duke-deploy service
# account, which can update Cloud Run services/jobs and push images.
#
# Pipeline:
#   1. Build + push the backend image to Artifact Registry (tag = git SHA)
#   2. Update the Cloud Run services + jobs to the new image via `gcloud run`
#      (NOT terraform apply -- the deploy SA is scoped to run.admin, and
#      terraform plan would need near-Owner permissions to refresh every
#      resource in state. Terraform owns the infra shape; the deployed image
#      is CI-managed and ignored via lifecycle.ignore_changes in cloud_run.tf.)
#   3. Run database migrations (Cloud Run job de-duke-migrate) on the new image
#   4. Smoke test against the live domain
#
# Required GitHub repo configuration (Settings -> Secrets and variables):
#   GCP_PROJECT_ID          (secret) - de-duke-services
#   GCP_WIF_PROVIDER        (secret) - full provider resource name from
#                                      terraform output
#   GCP_SERVICE_ACCOUNT     (secret) - de-duke-deploy SA email
#   GCP_REGION              (variable, optional) - default europe-west1
#   API_DOMAIN              (variable, optional) - default api.de-duke.com

name: Backend Deploy (GCP)

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-deploy-gcp.yml"
  workflow_dispatch:

permissions:
  id-token: write # required for Workload Identity Federation
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      # NOTE: only the image TAG crosses the job boundary, never the full
      # image URL. The URL embeds secrets.GCP_PROJECT_ID, and GitHub Actions
      # blanks job outputs that contain secret values -- passing the URL
      # through `outputs:` made the deploy job receive an empty string. Each
      # consumer rebuilds the URL from the tag + its own secret reference.
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        # Git SHA, never latest -- keeps every deployed revision traceable
        # to a commit (same convention as the retired ECR pipeline).
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker --quiet \
            ${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev

      - name: Resolve image URL (local only, not a job output)
        id: image-url
        run: |
          echo "value=${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/de-duke-backend/backend-api:${{ steps.tag.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: apps/backend
        run: |
          docker build -t "${{ steps.image-url.outputs.value }}" .

      - name: Push image
        run: docker push "${{ steps.image-url.outputs.value }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: gcp-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # Configure gcloud defaults ONCE via config properties, not per-command
      # flags: `gcloud run jobs update` on some gcloud versions does not
      # accept --region/--project flags (GA track), while `services update`
      # does. Setting the properties works for every command uniformly.
      - name: Configure gcloud defaults
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set run/region ${{ vars.GCP_REGION || 'europe-west1' }}

      # Update the API + worker Cloud Run services to the new image. The
      # image attribute is ignored by Terraform (lifecycle.ignore_changes in
      # infra/gcp/cloud_run.tf), so these gcloud updates are not reverted by
      # any later terraform apply. URL is rebuilt here from the non-secret
      # tag + this job's own secret reference (job outputs never carry it).
      - name: Deploy API service
        run: |
          IMAGE="${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/de-duke-backend/backend-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run services update de-duke-api --image="$IMAGE"

      - name: Deploy worker service
        run: |
          IMAGE="${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/de-duke-backend/backend-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run services update de-duke-worker --image="$IMAGE"

      # Point the migrate job at the new image so migrations run on the same
      # revision that is about to serve traffic. --container is required: the
      # job has two containers (backend-migrate + cloud-sql-proxy sidecar),
      # and gcloud refuses to guess which one the image belongs to. Region/
      # project come from the config properties set above (this command does
      # not accept them as flags on all gcloud versions).
      - name: Update migration job image
        run: |
          IMAGE="${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/de-duke-backend/backend-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run jobs update de-duke-migrate \
            --container=backend-migrate \
            --image="$IMAGE"

      # Keep the admin-bootstrap job on the current image too -- it runs the
      # same backend image (scripts/bootstrap_admin.py) and must pick up code
      # changes (e.g. the non-interactive ADMIN_* env-var mode). Without this
      # it silently stays on an old image forever.
      - name: Update admin bootstrap job image
        run: |
          IMAGE="${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/de-duke-backend/backend-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run jobs update de-duke-bootstrap-admin \
            --container=backend-bootstrap-admin \
            --image="$IMAGE"

      # Migrations run AFTER the new image is applied, BEFORE the smoke test
      # (same ordering as the retired AWS workflow). No --wait flag (version
      # skew: some gcloud releases only offer it in alpha/beta for jobs
      # execute) -- poll the execution to completion instead.
      #
      # No --container here: the migrate job takes no container-specific
      # overrides, and `--container` without a following container flag is
      # rejected ("No container overrides requested"). The multi-container
      # error only triggers when a container-specific flag (--update-env-vars
      # / --args) is present without --container.
      - name: Run database migrations
        run: |
          EXECUTION="$(gcloud run jobs execute de-duke-migrate \
            --format="value(metadata.name)" 2>&1 | tail -n 1)"
          echo "Execution: ${EXECUTION}"
          if [ -z "${EXECUTION}" ]; then
            echo "Failed to get execution name."
            exit 1
          fi
          for i in $(seq 1 60); do
            STATUS="$(gcloud run jobs executions describe "${EXECUTION}" \
              --format="value(status.conditions[0].status)" 2>/dev/null)"
            if [ "${STATUS}" = "True" ]; then
              echo "Migrations applied."
              exit 0
            fi
            if [ "${STATUS}" = "False" ]; then
              echo "Migration job FAILED."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for migration job."
          exit 1

      - name: Smoke test -- live domain health
        run: |
          URL="https://${{ vars.API_DOMAIN || 'api.de-duke.com' }}/health/live"
          for i in $(seq 1 12); do
            if curl -fsS "$URL"; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed after 12 attempts."
          exit 1
