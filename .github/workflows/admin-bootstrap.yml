# Admin bootstrap -- creates the FIRST De-Duke Admin account (FEAT-033).
#
# Cloud Run has no SSH/exec (unlike the retired AWS ECS Exec), so the
# operator action that used to be a one-off ECS task is now a one-off Cloud
# Run job (de-duke-bootstrap-admin) with the ADMIN_* env vars supplied here.
#
# This is a MANUAL, operator-triggered workflow (workflow_dispatch only) --
# deliberately not on any push trigger. The API has no HTTP path to create
# the first admin; this job is the only way (scripts/bootstrap_admin.py).
#
# Usage: Actions tab -> "Admin Bootstrap" -> Run workflow ->
#   Full name, Email, Password (min 12 chars)
#
# The password appears in the job's env (Cloud Run execution env + workflow
# logs). It is passed via `--env` to the job, which prints only the created
# user id/email, never the password. Treat the GitHub Actions run log as
# sensitive for the duration of the run.

name: Admin Bootstrap

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Full name of the first Admin"
        required: true
        type: string
      email:
        description: "Email of the first Admin"
        required: true
        type: string
      password:
        description: "Password (min 12 chars) -- appears in run logs"
        required: true
        type: string

permissions:
  id-token: write # required for Workload Identity Federation
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bootstrap-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # Use config properties (not --region/--project flags) -- some gcloud
      # versions do not accept these flags on `gcloud run jobs` commands.
      - name: Configure gcloud defaults
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set run/region ${{ vars.GCP_REGION || 'europe-west1' }}

      - name: Run admin bootstrap job
        run: |
          # --container IS required here because --update-env-vars is a
          # container-specific flag and the job has two containers
          # (backend-bootstrap-admin + cloud-sql-proxy sidecar). Per gcloud
          # docs, non-container flags (--format) must come BEFORE
          # --container, and container-specific flags (--update-env-vars)
          # must come AFTER it.
          #
          # No --wait flag: some gcloud versions only offer it in alpha/beta
          # for `jobs execute`. Capture the execution name and poll
          # `jobs executions describe` until it finishes.
          EXECUTION="$(gcloud run jobs execute de-duke-bootstrap-admin \
            --format="value(metadata.name)" \
            --container=backend-bootstrap-admin \
            --update-env-vars="ADMIN_FULL_NAME=${{ inputs.full_name }},ADMIN_EMAIL=${{ inputs.email }},ADMIN_PASSWORD=${{ inputs.password }}" \
            2>&1 | tail -n 1)"
          echo "Execution: ${EXECUTION}"
          if [ -z "${EXECUTION}" ]; then
            echo "Failed to get execution name."
            exit 1
          fi
          for i in $(seq 1 60); do
            STATUS="$(gcloud run jobs executions describe "${EXECUTION}" \
              --format="value(status.conditions[0].status)" 2>/dev/null)"
            if [ "${STATUS}" = "True" ]; then
              echo "Admin bootstrap job completed successfully."
              exit 0
            fi
            if [ "${STATUS}" = "False" ]; then
              echo "Admin bootstrap job FAILED."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for admin bootstrap job."
          exit 1

      - name: Confirm
        run: echo "Admin bootstrap job completed. The output above shows the created user id/email."
