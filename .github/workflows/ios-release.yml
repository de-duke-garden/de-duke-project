# iOS Release -- builds a signed App Store IPA on a GitHub-hosted macOS
# runner and uploads it to App Store Connect (TestFlight or App Store),
# with zero local Mac required.
#
#   * Runner: macos-15 (Xcode 26.3 / iOS 26.2 SDK). Meets Apple's
#     requirement (in effect since April 28, 2026) that new submissions be
#     built with the iOS 26 SDK. macos-latest currently maps to macos-26
#     (Xcode 26.6) -- either works; macos-15 is pinned for determinism.
#
#   * Signing: fastlane match stores the App Store distribution cert +
#     provisioning profile, encrypted, in a private git repo. The first
#     run (input `bootstrap: true`) CREATES the cert/profile on the runner
#     via the App Store Connect API key and pushes them to the match repo.
#     Every later run syncs them read-only. No Mac is ever needed.
#
#   * Team ID: injected into the Xcode project at build time from the
#     APPLE_TEAM_ID secret (update_project_team). Nothing Apple-specific
#     is hardcoded in project.pbxproj.
#
#   * Upload: TestFlight via `upload_to_testflight`; App Store binary via
#     `deliver` with submit_for_review: false -- metadata, screenshots and
#     the final "Submit for Review" stay in App Store Connect's web UI.
#
#   * Retry: almost every upload failure is Apple-side (an expired program
#     agreement, a transient App Store Connect error), and the IPA from a
#     failed run is still a correct, signed binary. The IPA artifact is
#     therefore uploaded even when a step failed, and a dispatch with
#     `reuse-ipa-from-run: <run id>` downloads that artifact and goes
#     straight to the upload lane, skipping signing sync and the build.
#
# Required repository secrets:
#   APPLE_TEAM_ID                              Apple Developer Team ID (Membership page)
#   APP_STORE_CONNECT_API_KEY_KEY_ID           ASC API key ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID        ASC API key issuer ID
#   APP_STORE_CONNECT_API_KEY_KEY              Full .p8 key content (multi-line)
#   MATCH_GIT_URL                              Private cert repo URL (https://github.com/you/deduke-ios-certs.git)
#   MATCH_PASSWORD                             Passphrase encrypting the match repo
#   MATCH_GIT_BASIC_AUTHORIZATION              base64("x-access-token:<PAT>") for the match repo
#   GOOGLE_MAPS_API_KEY                        Real Maps key. Used TWICE at release time: (1) written into
#                                              .env.json as the Dart define feeding places_service.dart REST
#                                              calls, and (2) injected into ios/Runner/Info.plist as GMSApiKey
#                                              for the native Google Maps iOS SDK.
#
# Required repository variables:
#   API_BASE_URL                               e.g. https://api.de-duke.org
#   PUBLIC_SHARE_BASE_URL                      e.g. https://de-duke.org
#
# Prerequisite (outside this repo): an app record with bundle ID

# Local fastlane runbook (from apps/mobile/ios/; requires a local Mac with
# bundle, fastlane and the match repo access):
#   bundle install
#   bundle exec fastlane ios bootstrap_match       # one-time cert/profile creation
#   bundle exec fastlane ios match_appstore        # read-only sync + set team
#   bundle exec fastlane ios upload_testflight     # TestFlight upload (needs IPA_PATH)
#   bundle exec fastlane ios upload_appstore       # App Store binary upload, no auto-submit (needs IPA_PATH)
# com.de-duke.mobile must exist in App Store Connect, and the ASC API
# key must have App Manager (or Admin) role.

name: iOS Release

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Upload target"
        type: choice
        options:
          - testflight
          - appstore
        default: testflight
      bootstrap:
        description: "First run? Create App Store cert + profile in the match repo (idempotent, safe to re-run)"
        type: boolean
        default: false
      build-number:
        description: "Build number (CFBundleVersion). Blank = GitHub run number"
        type: string
        default: ""
      build-name:
        description: "Version (CFBundleShortVersionString). Blank = pubspec.yaml version"
        type: string
        default: ""
      reuse-ipa-from-run:
        description: "Retry only: run ID of a prior run whose IPA artifact to upload as-is (skips signing + build). Blank = build from source"
        type: string
        default: ""

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    # macos-26: default Xcode is 26.x (iOS 26.5 SDK). Apple rejects any
    # upload built with an older SDK (iOS 26 SDK required since 2026-04-28).
    # macos-15's DEFAULT Xcode is 16.4 (iOS 18.5 SDK) and would be rejected
    # with a 409 at upload time, so do not downgrade this label.
    runs-on: macos-26
    # Least privilege. `actions: read` is what lets the retry path read a
    # prior run's IPA artifact (gh api run lookup + gh run download); nothing
    # here writes to the repo, and the match repo authenticates with its own
    # PAT secret rather than this token.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apps/mobile/ios

      - name: Install Flutter
        # Skipped on a retry: uploading an already-built IPA needs Ruby and
        # fastlane only, so the Flutter toolchain is dead weight there.
        if: ${{ inputs.reuse-ipa-from-run == '' }}
        uses: subosito/flutter-action@v2
        with:
          # Matches apps/mobile/.fvmrc and mobile-ci.yml -- keep in sync.
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Write production .env.json
        # .env.prod.json is gitignored (contains the real Maps key), so the
        # release build reconstructs .env.json from repo variables/secrets.
        # Only the build reads it, so a retry does not need it either.
        if: ${{ inputs.reuse-ipa-from-run == '' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          PUBLIC_SHARE_BASE_URL: ${{ vars.PUBLIC_SHARE_BASE_URL }}
        run: |
          jq -n \
            --arg api "${API_BASE_URL:-https://api.de-duke.org}" \
            --arg maps "${GOOGLE_MAPS_API_KEY:-}" \
            --arg share "${PUBLIC_SHARE_BASE_URL:-https://de-duke.org}" \
            '{API_BASE_URL: $api, GOOGLE_MAPS_API_KEY: $maps, PUBLIC_SHARE_BASE_URL: $share}' > .env.json

      - run: flutter pub get
        if: ${{ inputs.reuse-ipa-from-run == '' }}

      - name: Bootstrap signing assets (first run only)
        # Signing paths are all build-path only: a retry uploads an IPA that
        # is already signed, so match must not run (and `bootstrap: true`
        # alongside reuse-ipa-from-run is meaningless, not an error).
        if: ${{ inputs.bootstrap && inputs.reuse-ipa-from-run == '' }}
        working-directory: apps/mobile/ios
        run: bundle exec fastlane ios bootstrap_match

      - name: Sync signing assets (read-only)
        if: ${{ !inputs.bootstrap && inputs.reuse-ipa-from-run == '' }}
        working-directory: apps/mobile/ios
        run: bundle exec fastlane ios match_appstore

      - name: Inject Google Maps API key into Info.plist (native SDK)
        # The Flutter map UI reads GOOGLE_MAPS_API_KEY from .env.json (Dart
        # define) for REST calls, but the native Google Maps iOS SDK reads
        # GMSApiKey from Info.plist and crashes on first map render (Listing
        # Detail) when it is missing or empty. The source plist keeps an
        # EMPTY placeholder (frontend-owned), so inject insert-or-replace:
        # `Set` when the key already exists, `Add` when it does not -- the
        # two states are robust to commit ordering. Never inline the secret.
        # The plist change only matters to an archive, so a retry skips it.
        if: ${{ inputs.reuse-ipa-from-run == '' }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if /usr/libexec/PlistBuddy -c "Print :GMSApiKey" ios/Runner/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :GMSApiKey \"${GOOGLE_MAPS_API_KEY}\"" ios/Runner/Info.plist
          else
            /usr/libexec/PlistBuddy -c "Add :GMSApiKey string \"${GOOGLE_MAPS_API_KEY}\"" ios/Runner/Info.plist
          fi

      - name: Build release IPA
        # Skipped on a retry: the whole point of reuse-ipa-from-run is that
        # this archive (the 15 minute part) already happened once.
        if: ${{ inputs.reuse-ipa-from-run == '' }}
        env:
          BUILD_NUMBER: ${{ inputs.build-number || github.run_number }}
          BUILD_NAME: ${{ inputs.build-name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Export with MANUAL signing, pointing at the exact profile match
          # installed (match names it "match AppStore <bundle-id>"). Automatic
          # signing fails on CI: Xcode looks for a logged-in Apple account to
          # resolve profiles ("No Accounts" / "No profiles found").
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.de-duke.mobile</key>
                  <string>match AppStore com.de-duke.mobile</string>
              </dict>
          </dict>
          </plist>
          PLIST
          ARGS=(--release --export-options-plist=build/ExportOptions.plist --dart-define-from-file=.env.json --build-number="$BUILD_NUMBER")
          if [ -n "$BUILD_NAME" ]; then ARGS+=(--build-name="$BUILD_NAME"); fi
          flutter build ipa "${ARGS[@]}"

      - name: Download IPA from a prior run (retry)
        # The alternative to building: pull the artifact the failed run
        # already uploaded. The artifact is named from the SOURCE run's
        # number, and a run ID is not a run number, so the expected name is
        # resolved through the API instead of guessed -- a wrong or stale
        # IPA must fail here, never reach App Store Connect.
        if: ${{ inputs.reuse-ipa-from-run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_INPUT: ${{ inputs.reuse-ipa-from-run }}
          DISTRIBUTION: ${{ inputs.distribution }}
          BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
          BUILD_NAME_INPUT: ${{ inputs.build-name }}
        run: |
          set -u
          # Accept the bare run ID or a full run URL pasted from the browser
          # (the trailing path segment is the same number either way).
          SOURCE_RUN=$(printf '%s' "$REUSE_RUN_INPUT" | tr -d '[:space:]' | sed 's#.*/##')
          case "$SOURCE_RUN" in
            '' | *[!0-9]*)
              echo "::error::reuse-ipa-from-run must be a run ID (the number at the end of the run URL), got '${REUSE_RUN_INPUT}'."
              exit 1
              ;;
          esac

          if ! RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"); then
            echo "::error::Cannot read run $SOURCE_RUN in $GITHUB_REPOSITORY. Check the ID, and that the run is in this repository (a fork or a deleted run cannot be reused)."
            exit 1
          fi
          SOURCE_RUN_NUMBER=$(printf '%s' "$RUN_JSON" | jq -r '.run_number')
          SOURCE_BRANCH=$(printf '%s' "$RUN_JSON" | jq -r '.head_branch')
          ARTIFACT="de-duke-ios-${DISTRIBUTION}-${SOURCE_RUN_NUMBER}"
          echo "Run $SOURCE_RUN: number $SOURCE_RUN_NUMBER, branch $SOURCE_BRANCH, expected artifact '$ARTIFACT'"

          # Not fatal: retries are often dispatched from the default branch
          # while the binary came from a release branch. But the IPA is
          # uploaded exactly as built, so say which code it contains.
          if [ "$SOURCE_BRANCH" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::That IPA was built from '$SOURCE_BRANCH'; this run is on '$GITHUB_REF_NAME'. The binary is uploaded as-is, so build-number/build-name reflect the source run, not this one."
          fi
          if [ -n "$BUILD_NUMBER_INPUT" ] || [ -n "$BUILD_NAME_INPUT" ]; then
            echo "::warning::build-number/build-name are ignored here: the version comes from the downloaded binary."
          fi

          mkdir -p build/ios/ipa
          # Strict --name, no wildcard: downloading "whichever artifact is
          # present" is how a stale binary reaches TestFlight.
          if ! gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir build/ios/ipa; then
            AVAILABLE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[].name' 2>/dev/null | tr '\n' ' ' || true)
            echo "::error::Run $SOURCE_RUN has no artifact named '$ARTIFACT'. Artifacts present: ${AVAILABLE:-none (artifacts expire after the repository retention window)}. Re-dispatch with 'distribution' matching the source run, or leave reuse-ipa-from-run blank to build from source."
            exit 1
          fi
          # The re-upload below globs build/ios/ipa/*.ipa, so pull any nested
          # .ipa up to the top level: a prefixed path in the artifact must not
          # turn "reuse the IPA" into "re-upload nothing".
          find build/ios/ipa -mindepth 2 -type f -name '*.ipa' -exec mv {} build/ios/ipa/ \;
          ls -l build/ios/ipa

      - name: Locate the IPA to upload
        id: ipa
        # One absolute path feeds both upload lanes. Resolved by search so it
        # works whether the IPA was just built (build/ios/ipa/Runner.ipa) or
        # downloaded from a reuse run, and it fails here rather than leaving
        # fastlane to upload an empty path.
        run: |
          set -u
          ipas=$(find build/ios/ipa -type f -name '*.ipa' 2>/dev/null | sort || true)
          if [ -z "$ipas" ]; then
            echo "::error::No .ipa found under build/ios/ipa. The build must have failed before archiving, and no reuse run supplied one."
            exit 1
          fi
          count=$(printf '%s\n' "$ipas" | wc -l | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::warning::Found $count .ipa files under build/ios/ipa; using the first."
          fi
          echo "path=$PWD/$(printf '%s\n' "$ipas" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: inputs.distribution == 'testflight'
        working-directory: apps/mobile/ios
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: bundle exec fastlane ios upload_testflight

      - name: Upload to App Store Connect (no submit for review)
        if: inputs.distribution == 'appstore'
        working-directory: apps/mobile/ios
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: bundle exec fastlane ios upload_appstore

      - name: Upload IPA artifact
        # Runs even when the upload lane failed: a rejected upload is an
        # Apple-side problem fixed in App Store Connect, and rebuilding the
        # same binary for it is the waste this step exists to prevent. It
        # does not mask the failure -- the job still concludes red -- and
        # `if-no-files-found: error` still fails a build that produced
        # nothing. On a retry this re-uploads under this run's name, so the
        # chain stays downloadable.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: de-duke-ios-${{ inputs.distribution }}-${{ github.run_number }}
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error